[platformio]
default_envs = m5sticks3

[env:m5sticks3]
; Same platform build as tamagooshi, which is known to work on the StickS3.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Unified@^0.2.16

; Desktop simulator: the real firmware in an SDL window (brew install sdl2).
; Run the scripted tests with tools/sim_test.py.
[env:sim]
platform = native
build_type = debug
build_src_filter = +<*> -<upload.cpp> +<../sim/>
lib_deps =
    m5stack/M5Unified@^0.2.16
build_flags =
    -std=c++17
    -Isim/include
    -DM5GFX_BOARD=board_M5StickS3
    -DM5GFX_SCALE=2
    -DM5GFX_ROTATION=0
    -I"${sysenv.HOMEBREW_PREFIX}/include/SDL2"
    -L"${sysenv.HOMEBREW_PREFIX}/lib"
    -lSDL2
